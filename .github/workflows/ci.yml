name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:package
      - name: Install intended public host in disposable CI prefix
        run: npm install --prefix "${{ runner.temp }}/pi-adoption-host" --no-package-lock --no-audit --no-fund @earendil-works/pi-coding-agent@1.2.0
      - name: Verify adoption public host API and packed source
        env:
          PI_ADOPTION_HOST_ROOT: ${{ runner.temp }}/pi-adoption-host/node_modules/@earendil-works/pi-coding-agent
        run: npm run test:adoption-host
