name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      # A Windows failure must never cancel the Ubuntu leg. With fail-fast on,
      # run 39421474040 cancelled an Ubuntu job whose every step had succeeded.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    # Interim visible baseline for #18: Windows-only, job-level, advisory.
    # Ubuntu stays blocking. Raw Windows results stay inspectable on the job.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:package
